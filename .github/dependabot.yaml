version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
        prefix: "chore(deps):"
  - package-ecosystem: "npm"
    groups:
        "npm":
            patterns:
            - "markdownlint-cli2"
            - "cspell"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
        prefix: "chore(deps):"